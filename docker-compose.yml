services:
  postgres:
    image: postgres:16-alpine
    container_name: ledger-core-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ledger_user
      POSTGRES_PASSWORD: ledger_password
      POSTGRES_DB: ledger_core
    ports:
      - "5438:5432"
    volumes:
      - ledger_core_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_user -d ledger_core"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ledger_core_data:
